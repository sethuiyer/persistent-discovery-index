name: suites

# 20 self-checking suites and nothing was running them. A repo whose whole claim is
# "every number carries its warrant" cannot leave the warrants untested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: no third-party dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "found requirements.txt but PDI claims zero deps"; exit 1
          fi
      - name: run every suite
        run: |
          fail=0
          for f in test_*.py toys.py; do
            printf '%-34s' "$f"
            if out=$(python3 "$f" 2>&1); then
              echo "rc=0"
            else
              echo "rc=1  FAILED"
              echo "$out" | tail -25
              fail=1
            fi
          done
          exit $fail
      - name: repo claims still match the repo
        run: python3 test_repo_consistency.py
